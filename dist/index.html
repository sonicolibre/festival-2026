<script>
const names=['La acción del viento','Losa radiante','Proyecto siberia','Erratica','Aky Heredia','Christian Vaca','Vicky Ruggiero'];
const effects=['viento','color','perspectiva','salto','giro','rebote','espectro'];
const art=document.querySelector('.art'),videos=[...document.querySelectorAll('video')],root=document.documentElement;
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),small=matchMedia('(max-width:700px)');
let paused=reduced.matches,turn=0,animations=[];
try{root.dataset.theme=localStorage.getItem('sonico-theme')||'dark'}catch{}
function activeVideo(){return document.querySelector(small.matches?'.mobile':root.dataset.theme==='light'?'.light':'.dark')}
function playback(){videos.forEach(v=>{if(!paused&&v===activeVideo()){v.play().catch(()=>{})}else v.pause()});document.querySelector('.pause').textContent=paused?'Activar movimiento':'Pausar movimiento';document.querySelector('.pause').setAttribute('aria-pressed',String(paused))}
function theme(){const light=root.dataset.theme==='light';document.querySelector('.theme').textContent=light?'◐ Modo oscuro':'◐ Modo claro';document.querySelector('.theme').setAttribute('aria-label',light?'Activar modo oscuro':'Activar modo claro');document.querySelector('meta[name="theme-color"]').content=light?'#ffffff':'#000000';playback()}
function animate(el,frames,duration=1400){if(!paused&&!reduced.matches)animations.push(el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'}))}
function activate(i){
turn++;animations.forEach(a=>a.cancel());animations=[];
document.querySelectorAll('[data-artist]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.artist)===i)));
const hue=(turn*67+i*43)%360;art.style.filter='hue-rotate('+hue+'deg)';
const flower=document.querySelector('.flower'),orbit=document.querySelector('.orbit'),bar=document.querySelector('.bar');
if(i===0){animate(art,[{transform:'translateX(0)'},{transform:'translateX(4%) skewX(-6deg)'},{transform:'translateX(-2%) skewX(3deg)'},{transform:'none'}]);animate(orbit,[{opacity:0,transform:'rotate(0)'},{opacity:1},{opacity:0,transform:'rotate(180deg)'}],1800)}
if(i===1)animate(art,[{filter:'hue-rotate(0deg)'},{filter:'hue-rotate('+ (hue+180) +'deg) saturate(2.5)'},{filter:'hue-rotate('+hue+'deg)'}],1700);
if(i===2)animate(art,[{transform:'perspective(900px) rotateY(0)'},{transform:'perspective(900px) rotateY(-18deg) rotateZ(3deg)'},{transform:'perspective(900px) rotateY(12deg)'},{transform:'none'}],1800);
if(i===3){const v=activeVideo();if(!paused&&Number.isFinite(v.duration))v.currentTime=(v.currentTime+3.7)%v.duration;animate(art,[{transform:'translate(0)'},{transform:'translate(2%,-3%) skewY(3deg)'},{transform:'translate(-3%,2%)'},{transform:'none'}],900)}
if(i===4){animate(flower,[{opacity:0,transform:'rotate(0) scale(.4)'},{opacity:1,offset:.2},{opacity:1,offset:.75},{opacity:0,transform:'rotate(360deg) scale(1.6)'}],2100);animate(art,[{transform:'rotate(0)'},{transform:'rotate(-4deg)'},{transform:'rotate(3deg)'},{transform:'none'}],1600)}
if(i===5)animate(art,[{transform:'translateY(0)'},{transform:'translateY(-5%) scaleY(.94)'},{transform:'translateY(3%) scaleY(1.04)'},{transform:'translateY(-1%)'},{transform:'none'}],1200);
if(i===6)animate(bar,[{opacity:0,transform:'translateX(-80%) rotate(-10deg)'},{opacity:.85,offset:.4},{opacity:0,transform:'translateX(100%) rotate(30deg)',filter:'hue-rotate(220deg)'}],1800);
document.querySelector('.status').textContent=names[i]+': '+(paused||reduced.matches?'color actualizado':effects[i]);
}
names.forEach((name,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.className='artist';b.textContent=name;b.dataset.artist=i;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>activate(i));li.append(b);document.querySelector('.artists').append(li);const hit=b.cloneNode(true);hit.className='hotspot h'+i;hit.innerHTML='';const text=document.createElement('span');text.textContent=name;hit.append(text);hit.setAttribute('aria-label',name+' — activar animación');hit.tabIndex=-1;hit.addEventListener('click',()=>activate(i));document.querySelector('.hotspots').append(hit)});
document.querySelector('.theme').addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('sonico-theme',root.dataset.theme)}catch{}theme()});
document.querySelector('.pause').addEventListener('click',()=>{paused=!paused;animations.forEach(a=>a.cancel());animations=[];playback()});
small.addEventListener('change',playback);reduced.addEventListener('change',()=>{paused=reduced.matches;animations.forEach(a=>a.cancel());theme()});theme();
</script></body></html>
