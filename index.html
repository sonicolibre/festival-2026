<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Sónico Libre: música, ideas y encuentros. 7 de diciembre de 2026 en San Miguel."
    />
    <title>Festival Sónico Libre</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="preload" as="image" href="./assets/flyer-sonico-libre.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <dialog class="flyer-modal" id="flyer-modal" open aria-label="Afiche del Festival Sónico Libre">
      <div class="flyer-modal-art">
        <img src="./assets/flyer-sonico-libre.jpg" alt="Afiche original del Festival Sónico Libre" />
        <button class="flyer-modal-close" type="button" aria-label="Minimizar afiche"><span aria-hidden="true">×</span></button>
      </div>
    </dialog>
    <button class="flyer-reopen" id="flyer-reopen" type="button" aria-label="Volver a ver el afiche" title="Ver afiche" hidden>
      <img src="./assets/flyer-sonico-libre.jpg" alt="" />
    </button>

    <div class="cursor" aria-hidden="true"></div>

    <header class="topbar" aria-label="Sónico Libre">
      <a class="wordmark" href="#inicio" aria-label="Sónico Libre, inicio">
        <img class="wordmark-image" src="assets/logo.png" alt="Sónico Libre" />
      </a>
      <p class="topbar-event-note">07 DICIEMBRE 2026 <span aria-hidden="true">·</span> SAN MIGUEL</p>
    </header>

    <main id="inicio">
      <h1 class="sr-only">Sónico Libre — música para encontrarnos</h1>
      <section class="lineup" aria-label="Artistas de Sónico Libre">
        <div class="collage">
          <figure class="act act-wind" tabindex="0" aria-label="La acción del viento">
            <svg class="wind-art" viewBox="0 0 620 126" aria-hidden="true">
              <path class="wind-line wind-line-a" d="M11 44C70 2 112 89 174 45s87-43 118-14" />
              <path class="wind-line wind-line-b" d="M8 59c62-44 101 49 164 7s94-38 122-11" />
              <path class="wind-line wind-line-c" d="M18 76c55-42 92 42 150 9 51-29 89-35 116-8" />
              <rect class="wind-blue" x="210" y="8" width="118" height="77" />
              <text x="140" y="108" class="wind-kicker wind-kicker-desktop">La</text>
              <text x="176" y="103" class="wind-title wind-title-desktop">acción del viento</text>
              <text x="62" y="103" class="wind-title wind-title-mobile" textLength="548" lengthAdjust="spacing">acción del viento</text>
              <text x="4" y="103" class="wind-kicker wind-kicker-mobile">La</text>
            </svg>
            <figcaption class="sr-only">La acción del viento</figcaption>
          </figure>

          <figure class="act act-losa" tabindex="0" aria-label="Losa radiante">
            <svg viewBox="0 0 460 194" class="losa-art" aria-hidden="true">
              <rect class="losa-wash" x="65" y="18" width="208" height="127" />
              <ellipse class="orbit orbit-one" cx="195" cy="151" rx="145" ry="22" />
              <ellipse class="orbit orbit-two" cx="195" cy="151" rx="145" ry="22" transform="rotate(11 195 151)" />
              <text class="losa-title" x="18" y="126">Losa radiante</text>
              <text class="losa-caption" x="20" y="183">PRESENTANDO: LA PIEZAS DE MI DISPOSITIVO INFINITO</text>
            </svg>
            <figcaption class="sr-only">Losa radiante</figcaption>
          </figure>

          <figure class="act act-siberia" tabindex="0" aria-label="Proyecto Siberia">
            <svg viewBox="0 0 388 156" class="siberia-art" aria-hidden="true">
              <path class="siberia-cyan" d="M182 13h188v42H182z" />
              <rect class="siberia-black" x="0" y="23" width="184" height="86" />
              <path class="siberia-grain" d="M3 30h180M3 36h180M3 42h180M3 48h180M3 54h180M3 60h180M3 66h180M3 72h180M3 78h180M3 84h180M3 90h180" />
              <path class="siberia-shift" d="M6 18h186v5H6zM2 106h181v5H2z" />
              <text class="siberia-label" x="188" y="81">PROYECTO</text>
              <text class="siberia-label" x="188" y="117">SIBERIA</text>
            </svg>
            <figcaption class="sr-only">Proyecto Siberia</figcaption>
          </figure>

          <figure class="act act-erratica" tabindex="0" aria-label="Errática">
            <svg viewBox="0 0 474 172" class="erratica-art" aria-hidden="true">
              <path class="erratica-wave" d="M16 28c30-42 58 42 91 0s59 42 93 0 57 40 89 0 58 41 92 0" />
              <path class="erratica-path" d="M18 121 78 95l-7 20 89-48-25 43 96-45-10 29 81-30" />
              <text x="0" y="143" class="erratica-letter">E</text>
              <text x="44" y="143" class="erratica-letter">R</text>
              <text x="88" y="143" class="erratica-letter">R</text>
              <text x="132" y="143" class="erratica-letter">Á</text>
              <text x="176" y="143" class="erratica-letter">T</text>
              <text x="220" y="143" class="erratica-letter">I</text>
              <text x="264" y="143" class="erratica-letter">C</text>
              <text x="308" y="143" class="erratica-letter">A</text>
            </svg>
            <figcaption class="sr-only">Errática</figcaption>
          </figure>

          <figure class="act act-vaca" tabindex="0" aria-label="Christian Vaca">
            <svg viewBox="0 0 432 184" class="vaca-art" aria-hidden="true">
              <rect class="vaca-heat" x="12" y="28" width="300" height="126" />
              <text class="vaca-first" x="42" y="88">Christian</text>
              <text class="vaca-last" x="42" y="143">Vaca</text>
            </svg>
            <figcaption class="sr-only">Christian Vaca</figcaption>
          </figure>

          <figure class="act act-aky" tabindex="0" aria-label="Aky Heredia">
            <svg viewBox="0 0 340 70" class="aky-art" aria-hidden="true">
              <text class="aky-label" x="4" y="49">Aky Heredia</text>
            </svg>
            <figcaption class="sr-only">Aky Heredia</figcaption>
          </figure>
          <figure class="act act-vicky" tabindex="0" aria-label="Vicky Ruggiero">
            <svg viewBox="0 0 580 201" class="vicky-art" aria-hidden="true">
              <path class="vicky-cloud" d="M101 126c-13 0-20-9-17-19-11-7-8-24 5-27 0-14 17-20 28-11 8-15 30-13 35 3 16-8 31 4 27 18 17 4 15 27-2 30-3 11-16 15-27 8-11 13-31 9-36-4-4 2-8 2-13 2Z" />
              <text class="vicky-label" x="8" y="128"><tspan class="vicky-letter">V</tspan><tspan class="vicky-letter">i</tspan><tspan class="vicky-letter">c</tspan><tspan class="vicky-letter">k</tspan><tspan class="vicky-letter">y</tspan><tspan class="vicky-letter vicky-space">&#160;</tspan><tspan class="vicky-letter">R</tspan><tspan class="vicky-letter">u</tspan><tspan class="vicky-letter">g</tspan><tspan class="vicky-letter">g</tspan><tspan class="vicky-letter">i</tspan><tspan class="vicky-letter">e</tspan><tspan class="vicky-letter">r</tspan><tspan class="vicky-letter">o</tspan></text>
            </svg>
            <figcaption class="sr-only">Vicky Ruggiero</figcaption>
          </figure>
        </div>

        <a
          class="subscribe-button"
          href="mailto:sonicolibre7@gmail.com?subject=Sonico%20en%20CC%20Ra%C3%ADces%20San%20Miguel%207%2F12&amp;body=quiero%20mi%20descuento"
        >
          <span>Accedé a beneficios</span>
          <span class="button-dot" aria-hidden="true"></span>
        </a>
      </section>
    </main>

    <footer class="event-note">
      <p class="event-details">07 DICIEMBRE 2026 <span aria-hidden="true">·</span> SAN MIGUEL</p>
      <a class="instagram-link" href="https://www.instagram.com/sonico.libre/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @sonico.libre">@sonico.libre</a>
    </footer>
  </body>
</html>
